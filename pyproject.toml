[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "alttext"
version = "0.1.6"
description = "Local-first alt text and image accessibility audit."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "Biniyam Gashaw" }]
keywords = ["accessibility", "alt-text", "vision", "local-first", "wcag"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Topic :: Multimedia :: Graphics",
]
dependencies = [
  "beautifulsoup4>=4.12",
  "fastapi>=0.115",
  "httpx>=0.27",
  "pillow>=10.0",
  "pikepdf>=9.0",
  "python-docx>=1.1",
  "python-multipart>=0.0.9",
  "typer>=0.12",
  "uvicorn[standard]>=0.30",
]

[project.urls]
Homepage = "https://github.com/iambiniyam/alttext"
Issues = "https://github.com/iambiniyam/alttext/issues"

[project.optional-dependencies]
model = ["mlx-vlm>=0.7.8"]
dev = ["httpx>=0.27", "pytest>=8.3", "ruff>=0.6"]

[project.scripts]
alttext = "alttext.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/alttext"]


[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
ignore = ["B008"]
